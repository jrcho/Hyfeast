<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f77b4"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d62728"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="360" fill="#fff"/>
  <rect x="40" y="70" width="680" height="250" fill="#e8f4ff" stroke="none"/>
  <line x1="40" y1="70" x2="720" y2="70" stroke="#1f77b4" stroke-width="3"/>
  <text x="52" y="58" font-family="Arial, sans-serif" font-size="18" fill="#1f77b4">free surface point x_fs</text>

  <line x1="180" y1="95" x2="180" y2="310" stroke="#222" stroke-width="8" stroke-linecap="round"/>
  <circle cx="180" cy="95" r="6" fill="#222"/>
  <circle cx="180" cy="310" r="6" fill="#222"/>
  <text x="142" y="335" font-family="Arial, sans-serif" font-size="17" fill="#222">beam line</text>

  <line x1="180" y1="135" x2="300" y2="135" stroke="#d62728" stroke-width="3" marker-end="url(#arrow-red)"/>
  <line x1="180" y1="205" x2="380" y2="205" stroke="#d62728" stroke-width="4" marker-end="url(#arrow-red)"/>
  <line x1="180" y1="275" x2="460" y2="275" stroke="#d62728" stroke-width="5" marker-end="url(#arrow-red)"/>
  <text x="490" y="280" font-family="Arial, sans-serif" font-size="18" fill="#d62728">q(x) [px, py, pz]_ECS</text>

  <line x1="575" y1="70" x2="575" y2="205" stroke="#555" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="575" y1="70" x2="575" y2="205" stroke="#555" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="590" y="144" font-family="Arial, sans-serif" font-size="17" fill="#555">d(x)</text>

  <line x1="625" y1="82" x2="625" y2="150" stroke="#1f77b4" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="642" y="121" font-family="Arial, sans-serif" font-size="17" fill="#1f77b4">gdir</text>

  <rect x="515" y="222" width="160" height="54" fill="#fff" stroke="#777"/>
  <line x1="535" y1="248" x2="655" y2="248" stroke="#d62728" stroke-width="4" marker-end="url(#arrow-red)"/>
  <text x="535" y="270" font-family="Arial, sans-serif" font-size="15" fill="#333">width converts pressure to line load</text>

  <text x="72" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#222">LineDistributed HydroStaticPressure</text>
  <text x="72" y="350" font-family="Arial, sans-serif" font-size="15" fill="#333">q(x) = gamma max((x - x_fs) dot gdir, 0) width; direction is supplied as ECS coefficients.</text>
</svg>
