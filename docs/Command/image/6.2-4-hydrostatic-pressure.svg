<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Hydrostatic pressure on an element surface</title>
  <desc id="desc">A free surface point, downward gravity direction, submerged surface, and linearly increasing pressure traction.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fbb"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c94c4c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="718" height="358" fill="#ffffff" stroke="#d7dee8"/>
  <rect x="72" y="96" width="430" height="198" fill="#d7ecff" opacity="0.65" stroke="none"/>
  <line x1="72" y1="96" x2="502" y2="96" stroke="#2f6fbb" stroke-width="3"/>
  <text x="80" y="82" font-family="Arial, sans-serif" font-size="18" fill="#234">free surface</text>
  <circle cx="212" cy="96" r="5" fill="#2f6fbb"/>
  <text x="222" y="91" font-family="Arial, sans-serif" font-size="16" fill="#234">x_fs</text>
  <line x1="612" y1="70" x2="612" y2="142" stroke="#2f6fbb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="630" y="112" font-family="Arial, sans-serif" font-size="18" fill="#234">g_hat</text>
  <polygon points="280,112 332,132 332,292 280,272" fill="#f6f8fb" stroke="#343a40" stroke-width="3"/>
  <line x1="332" y1="132" x2="472" y2="132" stroke="#c94c4c" stroke-width="2" marker-end="url(#arrow-red)"/>
  <line x1="332" y1="172" x2="506" y2="172" stroke="#c94c4c" stroke-width="2" marker-end="url(#arrow-red)"/>
  <line x1="332" y1="212" x2="540" y2="212" stroke="#c94c4c" stroke-width="2" marker-end="url(#arrow-red)"/>
  <line x1="332" y1="252" x2="574" y2="252" stroke="#c94c4c" stroke-width="2" marker-end="url(#arrow-red)"/>
  <line x1="332" y1="292" x2="608" y2="292" stroke="#c94c4c" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="462" y="124" font-family="Arial, sans-serif" font-size="16" fill="#7a2e2e">p = gamma d</text>
  <line x1="210" y1="96" x2="210" y2="214" stroke="#495057" stroke-dasharray="7 5" stroke-width="2"/>
  <line x1="210" y1="214" x2="332" y2="214" stroke="#495057" stroke-dasharray="7 5" stroke-width="2"/>
  <text x="220" y="205" font-family="Arial, sans-serif" font-size="16" fill="#343a40">d = (x - x_fs) dot g_hat</text>
  <text x="72" y="326" font-family="Arial, sans-serif" font-size="15" fill="#343a40">Only points with d &gt; 0 receive pressure. The traction follows the existing pressure sign convention, t = -p n.</text>
</svg>
