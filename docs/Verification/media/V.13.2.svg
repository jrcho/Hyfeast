<svg width="602" height="140" viewBox="0 0 602 140" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman,Times,serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#000"/>
    </marker>
    <marker id="arrThin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#666" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="602" height="140" fill="#fff"/>

  <!-- Box girder section -->
  <path d="M8,56 L292,56 L292,63 L210,71 L193,132 L107,132 L90,71 L8,63 Z" fill="none" stroke="#000" stroke-width="1.2"/>
  <path d="M108,87 L150,71 L195,79 L182,121 L118,121 Z" fill="none" stroke="#000" stroke-width="1.2"/>
  <circle cx="149" cy="96" r="4" fill="none" stroke="#000"/>
  <line x1="141" y1="96" x2="157" y2="96" stroke="#000"/>
  <line x1="149" y1="88" x2="149" y2="104" stroke="#000"/>

  <!-- Eccentricity dimensions -->
  <line x1="149" y1="6" x2="149" y2="56" stroke="#000" stroke-width="0.8"/>
  <line x1="149" y1="17" x2="247" y2="17" stroke="#000" stroke-width="0.8" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="149" y1="39" x2="220" y2="39" stroke="#000" stroke-width="0.8" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="247" y1="6" x2="247" y2="20" stroke="#000" stroke-width="0.8"/>
  <text x="194" y="13">b<tspan font-size="9" dy="3">2</tspan></text>
  <text x="180" y="35">b<tspan font-size="9" dy="3">1</tspan></text>

  <!-- Wheel loads -->
  <line x1="220" y1="36" x2="220" y2="55" stroke="#000" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="247" y1="36" x2="247" y2="55" stroke="#000" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="226" y="34">P<tspan font-size="9" dy="3">1</tspan></text>
  <text x="253" y="34">P<tspan font-size="9" dy="3">2</tspan></text>

  <!-- Beam model -->
  <line x1="358" y1="88" x2="592" y2="38" stroke="#000" stroke-width="1.6"/>
  <g fill="#fff" stroke="#000" stroke-width="0.8">
    <rect x="355" y="85" width="6" height="6"/>
    <rect x="397" y="76" width="6" height="6"/>
    <rect x="435" y="68" width="6" height="6"/>
    <rect x="475" y="59" width="6" height="6"/>
    <rect x="514" y="51" width="6" height="6"/>
    <rect x="553" y="43" width="6" height="6"/>
  </g>
  <line x1="499" y1="57" x2="492" y2="40" stroke="#000" stroke-width="0.8"/>
  <text x="470" y="35">Beam3D</text>

  <!-- Moving load P and torsional moment T -->
  <line x1="358" y1="52" x2="358" y2="82" stroke="#000" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="336" y="48">P = P<tspan font-size="9" dy="3">1</tspan><tspan dy="-3"> + P</tspan><tspan font-size="9" dy="3">2</tspan></text>
  <path d="M347,86 A11,11 0 1 1 369,94" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="366" y="114">T = b<tspan font-size="9" dy="3">1</tspan><tspan dy="-3">P</tspan><tspan font-size="9" dy="3">1</tspan><tspan dy="-3"> + b</tspan><tspan font-size="9" dy="3">2</tspan><tspan dy="-3">P</tspan><tspan font-size="9" dy="3">2</tspan></text>

  <!-- Moving direction -->
  <line x1="372" y1="71" x2="414" y2="60" stroke="#666" stroke-width="1" marker-end="url(#arrThin)"/>
  <text x="404" y="54" font-style="italic">v</text>

  <text x="340" y="134">LineMoving (Pz, Mx)</text>
</svg>
